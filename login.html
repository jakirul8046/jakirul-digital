<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Jakirul Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div class="login-card text-center">
        <h3 class="fw-bold mb-1 text-success">Admin Login</h3>
        <p class="text-secondary small mb-4">Welcome back, Jakirul!</p>

        <form id="adminLoginForm">
            <div class="mb-3 text-start">
                <label class="form-label text-secondary small">Username</label>
                <input type="text" id="loginUser" class="form-control bg-dark text-white border-secondary"
                    placeholder="Enter username" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label text-secondary small">Password</label>
                <input type="password" id="loginPass" class="form-control bg-dark text-white border-secondary"
                    placeholder="Enter password" required>
            </div>

            <div id="errorMsg" class="text-danger small mb-3 d-none">❌ ভুল ইউজারনেম বা পাসওয়ার্ড!</div>

            <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-3">🔓 Login to Dashboard</button>
        </form>

        <div class="mt-3">
            <a href="index.html" class="text-secondary text-decoration-none small">← Back to Main Website</a>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // 🔑 আপনার ইউজারনেম ও গোপন পাসওয়ার্ড
            const correctUser = "jakirul5519";
            const correctPass = "Jakirul7243"; // <-- পছন্দমতো পাসওয়ার্ড বদলে নিতে পারেন

            const userInput = document.getElementById('loginUser').value;
            const passInput = document.getElementById('loginPass').value;
            const errorMsg = document.getElementById('errorMsg');

            if (userInput === correctUser && passInput === correctPass) {
                localStorage.setItem("isLoggedIn", "true");
                window.location.href = "dashboard.html";
            } else {
                errorMsg.classList.remove('d-none');
            }
        });
    </script>

</body>

</html>
