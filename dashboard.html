<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Jakirul Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .sidebar {
            background-color: #1e293b;
            min-height: 100vh;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar p-3 border-end border-secondary">
                <h4 class="text-success fw-bold">⚙️ Admin Panel</h4>
                <hr class="text-secondary">
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="#" class="nav-link active bg-success">📊 Dashboard</a>
                    </li>
                    <li>
                        <a href="index.html" target="_blank" class="nav-link text-info mt-2">🌐 View Live Site</a>
                    </li>
                </ul>
                <hr class="text-secondary">
                <button onclick="logout()" class="btn btn-outline-danger w-100">🔒 Logout</button>
            </div>

            <!-- Content Area -->
            <div class="col-md-9 col-lg-10 p-4">
                <h2 class="fw-bold">Welcome, Jakirul Islam! 👋</h2>
                <p class="text-secondary">এটি আপনার ওয়েবসাইটের এডমিন কন্ট্রোল ড্যাশবোর্ড।</p>

                <div class="alert alert-success rounded-3 mt-4">
                    🎉 <strong>অভিনন্দন!</strong> আপনার ওয়েবসাইট এডমিন প্যানেলে সফলভাবে লগইন করেছেন।
                </div>
            </div>
        </div>
    </div>

    <script>
        // সিকিউরিটি চেক
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html";
        }

        function logout() {
            localStorage.removeItem("isLoggedIn");
            window.location.href = "login.html";
        }
    </script>

</body>

</html>
